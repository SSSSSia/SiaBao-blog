# 浜戞湇鍔″櫒閮ㄧ讲閰嶇疆锛堝弻浠撳簱鏋舵瀯锛?
# 浣跨敤鏂规硶锛歞ocker-compose -f docker-compose.prod.yml up -d --build
#
# 閲嶈鎻愮ず锛氶娆￠儴缃插墠锛岃鍏堣缃幆澧冨彉閲?CONTENT_REPO_PATH
# export CONTENT_REPO_PATH=/path/to/sia-blog-content
# 鎴栬€呯洿鎺ュ湪涓嬮潰鐨?volumes 閰嶇疆涓娇鐢ㄧ粷瀵硅矾寰?


services:
  # 鍓嶇鏈嶅姟
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-blog-frontend
    restart: unless-stopped
    networks:
      - blog-network
    environment:
      - NODE_ENV=production

  # 鍚庣鏈嶅姟
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-blog-backend
    restart: unless-stopped
    networks:
      - blog-network
    volumes:
      # 鎸傝浇鍐呭浠撳簱鐨勬暟鎹洰褰曪紙鍙屼粨搴撴灦鏋勶級
      # 娉ㄦ剰锛氬悗绔唬鐮佷腑鐨勬暟鎹矾寰勬槸 /app/data锛屼笉鏄?/app/server/data
      # 璇锋牴鎹疄闄呮儏鍐典慨鏀规璺緞涓?sia-blog-content 鐨勭粷瀵硅矾寰?
      # 渚嬪锛?root/sia-blog-content/server/data 鎴?/home/username/sia-blog-content/server/data
      - /root/blog/sia-blog-content/server/data:/app/data:rw
      # 鎸傝浇鍐呭浠撳簱鐨勫浘鐗囪祫婧愮洰褰?
      - /root/blog/sia-blog-content/server/public:/app/public:rw
    # 鍔犺浇鐜鍙橀噺鏂囦欢锛圖ocker Compose 浼氳鍙?.env 骞舵敞鍏ュ埌瀹瑰櫒鐜鍙橀噺涓級
    env_file:
      - /root/blog/sia-blog-content/server/.env
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false

  # Nginx 鍙嶅悜浠ｇ悊
  nginx:
    image: nginx:alpine
    container_name: my-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/logs/nginx:/var/log/nginx
      # 鍙€夛細鐩存帴閫氳繃 Nginx 鎻愪緵鍥剧墖鏈嶅姟锛堟洿楂樻晥锛?
      - /root/blog/sia-blog-content/server/public:/var/www/public:ro
    networks:
      - blog-network
    depends_on:
      - frontend
      - backend

networks:
  blog-network:
    driver: bridge
