# 云服务器部署配置（双仓库架构）
# 使用方法：docker-compose -f docker-compose.prod.yml up -d --build
#
# 重要提示：首次部署前，请先设置环境变量 CONTENT_REPO_PATH
# export CONTENT_REPO_PATH=/path/to/sia-blog-content
# 或者直接在下面的 volumes 配置中使用绝对路径


services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-blog-frontend
    restart: unless-stopped
    networks:
      - blog-network
    environment:
      - NODE_ENV=production

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-blog-backend
    restart: unless-stopped
    networks:
      - blog-network
    volumes:
      # 挂载内容仓库的数据目录（双仓库架构）
      # 注意：后端代码中的数据路径是 /app/data，不是 /app/server/data
      # 请根据实际情况修改此路径为 sia-blog-content 的绝对路径
      # 例如：/root/sia-blog-content/server/data 或 /home/username/sia-blog-content/server/data
      - /root/blog/sia-blog-content/server/data:/app/data:rw
      # 挂载内容仓库的图片资源目录
      - /root/blog/sia-blog-content/server/public:/app/public:rw
    # 加载环境变量文件（docker Compose 会读取 .env 并注入到容器环境变量中）
    env_file:
      - /root/blog/sia-blog-content/server/.env
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: my-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.http-only.conf:/etc/nginx/nginx.http-only.conf:ro
      - ./docker/nginx/nginx.https.conf:/etc/nginx/nginx.https.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/logs/nginx:/var/log/nginx
      # Let's Encrypt SSL 证书挂载（有域名时需要）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 可选：直接通过 Nginx 提供图片服务（更高效）
      - /root/blog/sia-blog-content/server/public:/var/www/public:ro
    networks:
      - blog-network
    depends_on:
      - frontend
      - backend
    # 根据是否设置 DOMAIN 选择不同的配置文件
    # - 有域名：使用 HTTPS 配置，HTTP 重定向到 HTTPS
    # - 无域名：使用仅 HTTP 配置，通过 IP 直接访问
    environment:
      - DOMAIN=${DOMAIN}
    entrypoint: /bin/sh
    command: >
      -c "if [ -n \"$$DOMAIN\" ]; then
            echo 'Using HTTPS configuration for domain: '$$DOMAIN &&
            envsubst '$$DOMAIN' < /etc/nginx/nginx.https.conf > /etc/nginx/nginx.conf &&
            exec nginx -g 'daemon off;';
          else
            echo 'Using HTTP-only configuration (no domain set)' &&
            cp /etc/nginx/nginx.http-only.conf /etc/nginx/nginx.conf &&
            exec nginx -g 'daemon off;';
          fi"

networks:
  blog-network:
    driver: bridge
