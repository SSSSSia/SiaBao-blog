# 云服务器部署配置（双仓库架构）
# 使用方法：docker-compose -f docker-compose.prod.yml up -d --build

version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-blog-frontend
    restart: unless-stopped
    networks:
      - blog-network
    environment:
      - NODE_ENV=production

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-blog-backend
    restart: unless-stopped
    networks:
      - blog-network
    volumes:
      # 挂载内容仓库的数据目录（双仓库架构）
      - ~/blog/sia-blog-content/server/data:/app/server/data:rw
      # 挂载内容仓库的图片资源目录
      - ~/blog/sia-blog-content/server/public:/app/server/public:rw
      # 挂载环境配置文件（注意：挂载到 /app/.env，因为 WORKDIR 是 /app）
      - ~/blog/sia-blog-content/server/.env:/app/.env:ro
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: my-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/logs/nginx:/var/log/nginx
      # 可选：直接通过 Nginx 提供图片服务（更高效）
      - ~/blog/sia-blog-content/server/public:/var/www/public:ro
    networks:
      - blog-network
    depends_on:
      - frontend
      - backend

networks:
  blog-network:
    driver: bridge
