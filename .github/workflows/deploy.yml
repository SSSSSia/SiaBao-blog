name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      # 仅文档/截图/CI 配置变更不触发部署（仍可用 workflow_dispatch 手动触发）
      - 'pic/**'
      - 'docs/**'
      - '*.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ===== 1. 在 CI runner 上构建前端（7G 内存，远离小内存服务器）=====
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-ui/package-lock.json

      - name: Build frontend
        working-directory: react-ui
        run: |
          npm ci
          npm run build

      - name: Verify dist produced
        run: |
          if [ ! -d react-ui/dist ] || [ -z "$(ls -A react-ui/dist 2>/dev/null)" ]; then
            echo "::error::react-ui/dist 为空，构建失败"
            exit 1
          fi
          echo "dist 文件数：$(find react-ui/dist -type f | wc -l)"

      # ===== 2. 把 dist/ 用 rsync 同步到服务器（--delete 清掉旧 chunk）=====
      - name: Configure SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync dist to server
        env:
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PROJECT_DIR: ${{ secrets.SERVER_PROJECT_PATH }}
        run: |
          PROJECT_DIR="${PROJECT_DIR:-/root/blog/SiaBao-blog}"
          echo "同步 dist -> ${SERVER_USER}@${SERVER_HOST}:${PROJECT_DIR}/react-ui/dist/"
          rsync -az --delete -e "ssh -p ${SSH_PORT}" \
            react-ui/dist/ \
            "${SERVER_USER}@${SERVER_HOST}:${PROJECT_DIR}/react-ui/dist/"

      # ===== 3. SSH：拉代码（不含 dist）→ 构建镜像 → 起服务 → 健康检查 =====
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 如果私钥设置了密码，请在仓库 Secrets 添加 SSH_PASSPHRASE 并取消下一行注释
          # passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: false
          timeout: 15m
          # 拉代码 + 构建后端镜像（pip install）+ 起服务，给足时间。
          command_timeout: 60m
          script: |
            set -e  # Exit immediately if a command exits with a non-zero status
            echo "=== Starting Deployment ==="

            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH }}"

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/root/blog/SiaBao-blog"
            fi

            echo "Using PROJECT_DIR=$PROJECT_DIR"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found: $PROJECT_DIR"
              echo "Please set secret SERVER_PROJECT_PATH to your real path"
              exit 1
            fi

            cd "$PROJECT_DIR"

            echo "Pulling latest code..."
            # 使用 fetch + reset 确保与远程完全同步
            # 云服务器上的代码不应该有本地修改
            # 注意：不要用 `git clean -fd`，否则会删掉上一步 rsync 送来的 react-ui/dist/
            if git fetch origin main && git reset --hard origin/main; then
              echo "✓ Code repository updated successfully"
            else
              echo "❌ Error: Failed to pull code repository"
              exit 1
            fi

            # 确认前端构建产物已就位（由上一步 rsync 同步）
            if [ ! -d "$PROJECT_DIR/react-ui/dist" ] || [ -z "$(ls -A "$PROJECT_DIR/react-ui/dist" 2>/dev/null)" ]; then
              echo "❌ Error: react-ui/dist not found on server. rsync step may have failed."
              exit 1
            fi
            echo "✓ Frontend dist found"

            # 验证 .env 文件是否存在
            if [ ! -f "$PROJECT_DIR/server/.env" ]; then
              echo "❌ Error: .env file not found in $PROJECT_DIR/server/.env"
              echo "Please create the .env file on the server"
              exit 1
            else
              echo "✓ .env file found"
            fi

            echo "Building images (frontend uses pre-built dist, backend runs pip install)..."
            docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" build --progress=plain

            echo "Stopping existing services after successful build..."
            docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" down --remove-orphans || true

            echo "Port usage before starting services..."
            if command -v ss >/dev/null 2>&1; then
              PORT_LISTENERS="$(ss -ltnp '( sport = :80 or sport = :443 )' 2>/dev/null || true)"
              echo "$PORT_LISTENERS"
            else
              PORT_LISTENERS="$(netstat -ltnp 2>/dev/null | grep -E ':(80|443)\s' || true)"
              echo "$PORT_LISTENERS"
            fi
            docker ps --format 'table {{.Names}}\t{{.Ports}}' | grep -E '(:80->|:443->)' || true

            if echo "$PORT_LISTENERS" | grep -E 'users:\(\("(nginx|apache2|httpd)"' >/dev/null 2>&1; then
              echo "Detected host web server on port 80/443; stopping it so Docker nginx can bind ports..."
              if [ "$(id -u)" -eq 0 ]; then
                systemctl stop nginx apache2 httpd 2>/dev/null || true
                service nginx stop 2>/dev/null || true
                service apache2 stop 2>/dev/null || true
                service httpd stop 2>/dev/null || true
              elif sudo -n true 2>/dev/null; then
                sudo systemctl stop nginx apache2 httpd 2>/dev/null || true
                sudo service nginx stop 2>/dev/null || true
                sudo service apache2 stop 2>/dev/null || true
                sudo service httpd stop 2>/dev/null || true
              else
                echo "Host web server is using port 80/443, but this SSH user cannot stop it without sudo."
                exit 1
              fi
            fi

            echo "Starting updated services..."
            docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" up -d --remove-orphans

            echo "Waiting for services to start..."
            sleep 10

            echo "Checking service status..."
            docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" ps

            echo "Running Nginx health check..."
            if curl -fsS http://localhost/health > /dev/null 2>&1; then
              echo "Nginx health check passed"
            else
              echo "Nginx health check failed"
              docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" logs --tail=200 nginx
              exit 1
            fi

            echo "Running backend health check (inside container)..."
            if docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health'); print('ok')" > /dev/null 2>&1; then
              echo "Backend health check passed"
            else
              echo "Backend health check failed"
              docker compose -f docker-compose.prod.yml --env-file "$PROJECT_DIR/server/.env" logs --tail=200 backend
              exit 1
            fi

            echo "=== Deployment Complete ==="
