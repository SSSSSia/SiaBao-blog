name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 如果私钥设置了密码，请在仓库 Secrets 添加 SSH_PASSPHRASE 并取消下一行注释
          # passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          timeout: 60s
          command_timeout: 30m
          script: |
            echo "=== Starting Deployment ==="

            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH }}"
            CONTENT_DIR="${{ secrets.SERVER_CONTENT_PATH }}"

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/root/blog/SiaBao-blog"
            fi
            if [ -z "$CONTENT_DIR" ]; then
              CONTENT_DIR="/root/blog/sia-blog-content"
            fi

            echo "Using PROJECT_DIR=$PROJECT_DIR"
            echo "Using CONTENT_DIR=$CONTENT_DIR"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found: $PROJECT_DIR"
              echo "Please set secret SERVER_PROJECT_PATH to your real path"
              exit 1
            fi

            cd "$PROJECT_DIR"

            echo "Pulling latest code..."
            git pull origin main

            if [ -d "$CONTENT_DIR" ]; then
              echo "Pulling content repository..."
              cd "$CONTENT_DIR"
              git pull origin main
              cd "$PROJECT_DIR"
            fi

            echo "Stopping existing services..."
            docker compose -f docker-compose.prod.yml down

            echo "Building and starting services..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "Waiting for services to start..."
            sleep 10

            echo "Checking service status..."
            docker compose -f docker-compose.prod.yml ps

            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Backend service is healthy"
            else
              echo "Backend health check failed"
            fi

            echo "=== Deployment Complete ==="
