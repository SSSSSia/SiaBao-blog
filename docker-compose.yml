version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-blog-frontend
    restart: unless-stopped
    # 通过 Nginx 内部通信，无需暴露端口
    # ports:
    #   - "3000:80"  # 仅用于调试时启用
    networks:
      - blog-network
    environment:
      - NODE_ENV=production

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-blog-backend
    restart: unless-stopped
    # 通过 Nginx 内部通信，无需暴露端口
    # ports:
    #   - "9090:9090"  # 仅用于调试时启用
    networks:
      - blog-network
    volumes:
      # 挂载数据目录，实现数据持久化
      - ./server/data:/app/data
      - ./server/public:/app/public  # 挂载公共文件目录（上传的图片）
      - ./server/.env:/app/.env:ro  # 只读挂载环境变量文件
    environment:
      - HOST=0.0.0.0
      - PORT=9090
      - DEBUG=false

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: my-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录（可选）
      - ./docker/logs/nginx:/var/log/nginx
    networks:
      - blog-network
    depends_on:
      - frontend
      - backend

networks:
  blog-network:
    driver: bridge

volumes:
  data:
    driver: local