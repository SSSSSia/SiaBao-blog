version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-blog-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - blog-network
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-blog-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - blog-network
    volumes:
      # 挂载数据目录，实现数据持久化
      - ./server/data:/app/data
      - ./server/.env:/app/.env:ro  # 只读挂载环境变量文件
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: my-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录（可选）
      - ./docker/logs/nginx:/var/log/nginx
    networks:
      - blog-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  blog-network:
    driver: bridge

volumes:
  data:
    driver: local
